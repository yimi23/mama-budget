# Mama Budget API and the ChatGPT app behind Caddy, which gets and renews both certificates on its own.
#   cp deploy/.env.example deploy/.env   (fill it; it is the API's api/.env plus MAMA_DOMAIN and MAMA_CHATGPT_DOMAIN)
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8787
    volumes:
      - mama-data:/app/data
      - mama-voice:/app/api/.cache/tts
    expose:
      - "8787"
  chatgpt:
    # Same image, different command: the MCP server in apps/chatgpt, talking to the API over the compose network.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["node", "apps/chatgpt/server.mjs"]
    environment:
      - MAMA_API=http://api:8787
      - MAMA_CHATGPT_PORT=8790
      - MAMA_CHATGPT_URL=https://${MAMA_CHATGPT_DOMAIN}
      - MAMA_SITE=https://mamabudget.com
    expose:
      - "8790"
    depends_on:
      - api
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MAMA_DOMAIN=${MAMA_DOMAIN}
      - MAMA_CHATGPT_DOMAIN=${MAMA_CHATGPT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - chatgpt
volumes:
  mama-data:
  mama-voice:
  caddy-data:
  caddy-config:
