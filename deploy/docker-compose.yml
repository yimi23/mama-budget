# Mama Budget API behind Caddy, which gets and renews the certificate on its own.
#   cp deploy/.env.example deploy/.env   (fill it; it is the API's api/.env plus MAMA_DOMAIN)
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8787
    volumes:
      - mama-data:/app/data
      - mama-voice:/app/api/.cache/tts
    expose:
      - "8787"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MAMA_DOMAIN=${MAMA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
volumes:
  mama-data:
  mama-voice:
  caddy-data:
  caddy-config:
