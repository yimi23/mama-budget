<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mama Budget</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Who is checking on you?</h1>
        <p class="lead">Same rules. Different mouth. You can change this any time.</p>
      </header>
      <div class="pick" role="radiogroup" aria-label="Your grandma">
        <button type="button" class="grandma" data-grandma="mama" role="radio" aria-checked="false">
          <span class="tile mama"><img src="/faces/mama/calm.svg" alt="" width="164" height="170" /></span>
          <span class="name">Mama</span>
          <span class="desc">Nigerian. Warm first, loud second. Tells you what it costs back home.</span>
        </button>
        <button type="button" class="grandma" data-grandma="nana" role="radio" aria-checked="false">
          <span class="tile nana"><img src="/faces/nana/calm.svg" alt="" width="164" height="170" /></span>
          <span class="name">Nana</span>
          <span class="desc">Midwestern. Sweet first, dry second. Says less than she means.</span>
        </button>
      </div>
      <p id="picked" class="status" role="status" aria-live="polite"></p>
      <section class="group" aria-labelledby="over-title">
        <h2 id="over-title">Start over</h2>
        <p>She forgets your answers and asks again, like a fresh install. Use it before each demo.</p>
        <button id="over" type="button" class="pill">Start over</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
