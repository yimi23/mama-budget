<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>share</title>
<style>
@font-face { font-family: 'Bricolage Grotesque'; font-weight: 800; src: url('assets/fonts/bricolage-800.woff2') format('woff2'); }
html, body { margin: 0; }
.card { width: 1200px; height: 630px; background: #FBF8F3; color: #22172A; display: flex; align-items: center; justify-content: space-between; padding: 64px 72px; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; position: relative; overflow: hidden; }
h1 { font: 800 92px/0.96 'Bricolage Grotesque', system-ui, sans-serif; letter-spacing: -0.025em; margin: 0 0 26px; max-width: 640px; }
p { font-size: 27px; line-height: 1.4; color: #5E566B; margin: 0; max-width: 600px; }
.brand { position: absolute; left: 72px; bottom: 48px; display: flex; align-items: center; gap: 12px; font: 800 24px 'Bricolage Grotesque', system-ui, sans-serif; }
.ring { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #E2A12A; background: #DDF1E8; overflow: hidden; display: flex; align-items: flex-end; }
.ring img { width: 100%; height: 100%; }
.her { width: 400px; height: 400px; border-radius: 40px; background: #DDF1E8; overflow: hidden; display: flex; align-items: flex-end; flex: none; }
.her img { width: 100%; height: 100%; }
.url { position: absolute; right: 72px; bottom: 52px; font-size: 20px; color: #5E566B; }
</style></head>
<body><div class="card">
  <div><h1>Your mother is in your cart.</h1><p>One number for the week. Held to, before you pay. What you need, she never touches.</p></div>
  <div class="her"><img src="assets/faces/mama/shocked.svg" alt="" /></div>
  <div class="brand"><span class="ring"><img src="assets/faces/mama/calm.svg" alt="" /></span>Mama Budget</div>
  <div class="url">mamabudget.com</div>
</div></body></html>
